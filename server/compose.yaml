services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bookmark_manager
      POSTGRES_USER: bookmark_app
      POSTGRES_PASSWORD: local_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookmark_app -d bookmark_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
